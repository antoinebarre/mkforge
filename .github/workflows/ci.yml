name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run CI checks
        run: make ci

